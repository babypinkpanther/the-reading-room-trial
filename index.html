const MENU=`<div class="pp"><h2>The Reading Room</h2><details open><summary>What is this?</summary><p>A short quiz that tells you which creature reads like you: the Owl, Fox, Dormouse, Magpie or Hedgehog. It’s for people who read constantly and people who swear they don’t. You get a tarot-style reading, songs for the mood, and five niche books that fit your temperament, not the bestseller list.</p></details><details><summary>What makes it different</summary><ul><li>It starts with life, not books. Nobody’s asked how many they read last year.</li><li>Your answers are scored on five personality traits, then matched to a creature by profile similarity, not a vote count, and calibrated so random answers land evenly on all five.</li><li>The book picks are deliberately niche and span literary, speculative, translated, nature writing and comfort reads.</li><li>Every result is a full reading: strengths, shadow, who you click with and why, and how clearly you fit.</li></ul></details><details><summary>The science behind it</summary><p>The five traits come from established psychology: Need for Cognition (Cacioppo & Petty, 1982), Openness to Experience (Costa & McCrae; DeYoung and colleagues’ aspects), Absorption (Tellegen & Atkinson, 1974), mood management theory (Zillmann, 1988) and Need for Cognitive Closure (Webster & Kruglanski, 1994). Questions mix agree/disagree items, some reverse-keyed, with forced choices and scenarios.</p><p><b>Honest limits:</b> the questions are original items inspired by those constructs, not the validated scales. The creature profiles are my design and haven’t been normed on real readers. The “how clearly you fit” score is simply the gap between your top two matches, not a statistic about other people.</p></details><details><summary>Comparing with a friend</summary><p>After your result, open a card and swipe through. To compare, share your link or your compare code, hand the phone to a friend, or paste a friend’s code into the “Compare us” box. <b>Chemistry</b> blends how alike your reading traits are (wavelength) with how different they are (spark). It’s for fun, not a prediction.</p></details><details><summary>The five reading traits</summary>${TI.map((t,i)=>`<p><b>${TR[i]}.</b> ${t[0]}</p>`).join("")}</details><details><summary>The five creatures</summary>${Object.values(K).map(k=>`<p><b>${k.n}, ${k.t}.</b> ${k.tag}</p>`).join("")}</details><details><summary>Art credits</summary>${Object.values(IMG).map(i=>`<p>${i.cr}</p>`).join("")}<p>The other creature drawings are my own sketches for now.</p></details><details><summary>About the maker</summary><p>Made by Sanskriti Saxena, who writes personal essays on Substack in <i>Field Notes on Being</i>. This quiz began as a wish to get non-readers curious about books without making them feel judged, and to give readers a better word for how they read.</p><p><b>© 2026 Sanskriti Saxena.</b> The quiz, its questions, creatures and readings are original work. Please don’t copy, repost or sell them without asking.</p></details><button class="btn go" id="cl">Back to the quiz</button></div>`;

function start(){{const v=document.getElementById("vw");if(v){v.classList.remove("open");v.innerHTML=""}document.body.style.overflow="";VC=null}const SHB=CMP&&K[CMP.k]?`<p class="sm" style="background:var(--kraft);padding:8px 12px;transform:rotate(-1deg)">${CMP.fromPhone?"Your friend":"A friend"} drew <b>${K[CMP.k].n}</b>. ${CMP.fromPhone?"Your turn! ":""}Take the quiz to see how you two compare.</p>`:"";window.scrollTo(0,0);for(let c=0;c<4;c++){const a=Q.slice(c*5,c*5+5);for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));[a[j],a[r]]=[a[r],a[j]]}Q.splice(c*5,5,...a)}document.body.classList.remove("night");i=0;raw=[0,0,0,0,0];seen={};hist=[];ans=[];$.innerHTML=`<div class="pp ch">${SHB}<p class="cap">a quiz in four chapters</p><h1 id="ti">The Reading Room</h1>${ug?"":`<p class="cap ctr" id="hint" style="margin:0">tap anywhere to wake the typewriter</p>`}${SC[4]}<p style="font-size:24px;font-family:var(--h);font-weight:700"><span class="hl">Maybe every reader just needs the right shelf.</span></p><p>Twenty questions about how you meet the world, then a tarot reading for the way you read. Nothing about how many books you’ve finished.</p><p class="sm mute">Scored on five traits from personality psychology. It’s a playful profile, not a clinical test. The menu up top has the full science.</p><button class="btn go" id="go">Step inside</button><details class="cmpd"><summary>Have a friend’s code?</summary><input id="ic" class="fi" placeholder="e.g. FOX-80-30-50-20-10" autocomplete="off"><button class="btn alt" id="ig">Use this code</button><p class="sm" id="im"></p></details></div>`;watch();const ti=document.getElementById("ti");ti.style.position="relative";ti.innerHTML=`<span style="visibility:hidden">The Reading Room</span>`;let kd=false;const kick=()=>{if(kd)return;kd=true;const h=document.getElementById("hint");if(h)h.remove();tw(ti,"The Reading Room",115,350)};if(ug)setTimeout(kick,300);else{document.addEventListener("pointerdown",kick,{once:true});setTimeout(kick,2600)}document.getElementById("go").onclick=()=>{snd("pick");next()};document.getElementById("ig").onclick=()=>{const c=parseCode(document.getElementById("ic").value);if(!c){document.getElementById("im").textContent="That code doesn’t look right.";return}snd("pick");CMP=c;start()}}
